<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription Adhérent</title>
</head>
<body>
    <h1 align="center"> Formulaire d'inscription </h1>
    <header>
    <hr>
    <p align="center">
        <a href="index.html">Accueil</a> | 
        <a href="activites-liste.html">Activités</a> |
        <a href="index.html">A propos</a> |
        <a href="inscription-adherent.html">Inscription</a>
    </p>
  </header>
  <content>
    <hr>
    <form action=".../adherent detail.html" method="post" align="center">
        <div>
            <label for="nom">Nom :</label>
            <input type="text" id="nom" name="nom" minlength="3" maxlength="20" pattern="[A-Za-zÀ-ÿ ]{3,20}" title="Entre 3 et 20 caractères. Lettres et espaces uniquement." required>
        </div>
        <br>
        <div>
            <label for="prenom">Prénom :</label>
            <input type="text" id="prenom" name="prenom" minlength="3" maxlength="20" pattern="[A-Za-zÀ-ÿ ]{3,20}" title="Entre 3 et 20 caractères. Lettres et espaces uniquement." required>
        </div>
        <br>
        <div>
            <label for="email">Email :</label>
            <input type="email" id="email" placeholder="contact@exemple.com" name="email" maxlength="255" title="Veuillez entrer une adresse email valide." required>
        </div>
        <br>
        <div> 
            <label for="categorie">Activité souhaitée :</label>
            <select id="categorie" name="categorie" required>
                <option value="football">Football</option>
                <option value="natation">Natation</option>
                <option value="fitness">Fitness</option>
            </select>   
        </div>
        <br>
        <div>
            <label for="duree">Durée :</label>
            <select id="duree" name="duree" required>
                <option value="1">1 mois</option>
                <option value="3">3 mois</option>
                <option value="6">6 mois</option>
                <option value="12">12 mois</option>
            </select>
        </div>
        <br>
        <div>
            <label for="tarif" >Tarif :</label>
            <input type="text" id="tarif" name="tarif" value="Calculé automatiquement" readonly>
        </div>
        <br>
        <div>
            <input type="submit" value="S'inscrire">
            <input type="reset" value="Annuler">
        </div>
    </form>
    <hr>
  </content>
  <footer>
    <p align="center"> &copy; 2026 Club Sportif - Tous droits réservés. </p>
    <p align="center">
      <img src="../assets/img/logo.png" alt="LOGO Club Sportif" width="200">
    </p>
  </footer>
    
</body>
</html>
